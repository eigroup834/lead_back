# Exhibitor CRM — Nginx reverse proxy (no Docker).
# Serves the built React SPA and proxies /api + /files to the Node API (PM2).

upstream exhibitor_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  server_name crm.example.com;

  # --- Frontend (static build) ---
  root /var/www/exhibitor/frontend/dist;
  index index.html;

  # gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;
  gzip_min_length 1024;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # long-cache hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # --- API ---
  location /api/ {
    proxy_pass http://exhibitor_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # --- Export downloads ---
  location /files/ {
    proxy_pass http://exhibitor_api;
    proxy_set_header Host $host;
  }

  client_max_body_size 10m;
}

# For TLS, terminate with certbot/letsencrypt and add a 443 server block,
# redirecting 80 -> 443. Keep refresh-token cookies Secure in production.
